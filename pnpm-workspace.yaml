# pnpm 11+ blocks dependencies' install scripts unless they are approved here, and
# `strictDepBuilds` (default true) makes `pnpm install` fail on any unapproved one
# (ERR_PNPM_IGNORED_BUILDS on Vercel). sharp is the image library Next.js uses for
# image optimization; its install step sets up the native binary.
allowBuilds:
  sharp: true
